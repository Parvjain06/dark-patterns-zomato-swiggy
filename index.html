<!doctype html>
<html lang="en" data-theme="expose">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dark Patterns · SSDI Investigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ========= DESIGN TOKENS ========= */
:root {
  --hue: 18;
  --font-display: "Instrument Serif", "Fraunces", Georgia, serif;
  --font-sans: "Geist", "Inter Tight", -apple-system, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
}

/* Exposé — warm paper */
:root[data-theme="expose"] {
  --bg: oklch(96% 0.018 75);
  --bg-elev: oklch(98% 0.012 75);
  --bg-sub: oklch(93% 0.022 70);
  --ink: oklch(16% 0.02 30);
  --ink-dim: oklch(40% 0.02 30);
  --muted: oklch(60% 0.015 30);
  --border: oklch(86% 0.02 70);
  --border-strong: oklch(70% 0.03 60);
  --accent: oklch(58% 0.19 30);
  --accent-soft: oklch(90% 0.07 55);
  --danger: oklch(55% 0.22 25);
  --warn: oklch(72% 0.17 70);
  --ok: oklch(58% 0.14 150);
  --rule: 1px solid var(--ink);
  --rule-thin: 1px solid var(--border);
  --shadow-hard: 4px 4px 0 var(--ink);
}

/* Terminal — amber on black */
:root[data-theme="terminal"] {
  --bg: oklch(12% 0.015 40);
  --bg-elev: oklch(16% 0.02 40);
  --bg-sub: oklch(18% 0.025 40);
  --ink: oklch(88% 0.08 70);
  --ink-dim: oklch(70% 0.06 70);
  --muted: oklch(50% 0.04 70);
  --border: oklch(28% 0.02 40);
  --border-strong: oklch(45% 0.05 60);
  --accent: oklch(78% 0.18 60);
  --accent-soft: oklch(30% 0.08 60);
  --danger: oklch(68% 0.22 25);
  --warn: oklch(80% 0.18 80);
  --ok: oklch(72% 0.18 150);
  --rule: 1px solid var(--ink-dim);
  --rule-thin: 1px solid var(--border);
  --shadow-hard: 4px 4px 0 oklch(30% 0.1 50);
  --font-display: "JetBrains Mono", ui-monospace, monospace;
  --font-sans: "JetBrains Mono", ui-monospace, monospace;
}

/* Pop — cream & electric */
:root[data-theme="pop"] {
  --bg: oklch(96% 0.01 100);
  --bg-elev: oklch(100% 0 0);
  --bg-sub: oklch(92% 0.015 100);
  --ink: oklch(14% 0.02 280);
  --ink-dim: oklch(40% 0.02 280);
  --muted: oklch(60% 0.015 280);
  --border: oklch(18% 0.02 280);
  --border-strong: oklch(14% 0.02 280);
  --accent: oklch(62% 0.24 310);
  --accent-soft: oklch(90% 0.12 310);
  --danger: oklch(60% 0.26 25);
  --warn: oklch(82% 0.19 90);
  --ok: oklch(65% 0.22 150);
  --rule: 2px solid var(--ink);
  --rule-thin: 1px solid var(--ink);
  --shadow-hard: 6px 6px 0 var(--ink);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.display { font-family: var(--font-display); font-weight: 400; letter-spacing: -0.02em; }
button { font: inherit; cursor: pointer; }

/* ========= MASTHEAD ========= */
.masthead {
  border-bottom: var(--rule);
  padding: 18px 32px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg);
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(8px);
}
.masthead-left { display: flex; align-items: center; gap: 16px; }
.masthead-title { font-family: var(--font-display); font-size: 22px; letter-spacing: -0.02em; line-height: 1; }
.masthead-sub { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-dim); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 4px; }
.masthead-issue { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-dim); letter-spacing: 0.15em; text-transform: uppercase; padding: 4px 10px; border: var(--rule-thin); border-radius: 99px; }

/* ========= TABS ========= */
.tabs-bar {
  display: flex;
  border-bottom: var(--rule);
  background: var(--bg);
  padding: 0 32px;
  gap: 0;
  overflow-x: auto;
  position: sticky; top: 63px; z-index: 40;
}
.tab-btn {
  background: none; border: none;
  padding: 16px 24px 14px;
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-dim);
  border-bottom: 3px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
  transition: color 0.15s;
}
.tab-btn:hover { color: var(--ink); }
.tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); }
.tab-num { color: var(--muted); margin-right: 8px; font-size: 10px; }

/* ========= PAGE ========= */
.page { padding: 40px 32px 80px; max-width: 1280px; margin: 0 auto; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.headline { font-family: var(--font-display); font-size: clamp(40px, 6vw, 76px); line-height: 0.95; letter-spacing: -0.03em; margin: 0 0 16px; }
.headline em { font-style: italic; color: var(--accent); }
.kicker { font-size: 18px; color: var(--ink-dim); max-width: 60ch; line-height: 1.5; margin: 0; }
.section-title { font-family: var(--font-display); font-size: 32px; letter-spacing: -0.02em; margin: 0 0 8px; }
.section-sub { font-size: 14px; color: var(--ink-dim); margin: 0 0 24px; max-width: 60ch; }

/* Byline bar */
.byline {
  display: flex; gap: 24px; align-items: center;
  border-top: var(--rule-thin); border-bottom: var(--rule-thin);
  padding: 12px 0; margin: 32px 0;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-dim);
  flex-wrap: wrap;
}
.byline strong { color: var(--ink); font-weight: 500; }
.byline-dot { width: 4px; height: 4px; border-radius: 99px; background: var(--muted); }

/* ========= HEADLINE STATS (4-up with big numbers) ========= */
.bignums {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border: var(--rule);
  background: var(--bg-elev);
  box-shadow: var(--shadow-hard);
}
.bignum {
  padding: 24px;
  border-right: var(--rule-thin);
  display: flex; flex-direction: column; gap: 6px;
  position: relative;
}
.bignum:last-child { border-right: none; }
.bignum-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-dim); }
.bignum-v { font-family: var(--font-display); font-size: 48px; line-height: 1; letter-spacing: -0.03em; }
.bignum-note { font-size: 12px; color: var(--ink-dim); font-family: var(--font-mono); }

/* ========= TWO-COL GRID ========= */
.cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.cols-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

.card {
  border: var(--rule-thin);
  background: var(--bg-elev);
  padding: 20px;
}
.card.boxed { border: var(--rule); box-shadow: var(--shadow-hard); }
.card-title { font-family: var(--font-display); font-size: 20px; letter-spacing: -0.01em; margin: 0 0 4px; }
.card-sub { font-size: 13px; color: var(--ink-dim); margin: 0 0 16px; }

/* ========= PATTERNS LIST ========= */
.pattern-list { display: flex; flex-direction: column; }
.pattern-row {
  display: grid;
  grid-template-columns: 48px 1fr auto;
  gap: 16px; align-items: center;
  padding: 14px 0;
  border-top: var(--rule-thin);
}
.pattern-row:last-child { border-bottom: var(--rule-thin); }
.pattern-num { font-family: var(--font-display); font-size: 32px; color: var(--accent); line-height: 1; }
.pattern-name { font-weight: 500; font-size: 15px; margin-bottom: 2px; }
.pattern-desc { font-size: 12.5px; color: var(--ink-dim); }
.sev {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 4px 10px;
  border: var(--rule-thin);
  white-space: nowrap;
}
.sev.high { background: color-mix(in oklab, var(--danger) 15%, transparent); border-color: var(--danger); color: var(--danger); }
.sev.med { background: color-mix(in oklab, var(--warn) 20%, transparent); border-color: var(--warn); color: oklch(50% 0.18 60); }
.sev.low { background: var(--bg-sub); color: var(--ink-dim); }

/* ========= FORMULA ========= */
.formula {
  font-family: var(--font-mono);
  font-size: 15px;
  padding: 20px 24px;
  background: var(--bg-sub);
  border: var(--rule-thin);
  border-left: 4px solid var(--accent);
  margin: 16px 0;
  line-height: 1.7;
}
.formula .coef { color: var(--accent); font-weight: 600; }

/* ========= META CARD (project details) ========= */
.meta-list { display: flex; flex-direction: column; }
.meta-row {
  display: grid; grid-template-columns: 1fr 1.6fr;
  padding: 10px 0;
  border-top: var(--rule-thin);
  font-size: 13px;
}
.meta-row:last-child { border-bottom: var(--rule-thin); }
.meta-k { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-dim); }
.meta-v { color: var(--ink); }

/* ========= DATA TABLE ========= */
.datatable { border: var(--rule-thin); overflow-x: auto; background: var(--bg-elev); }
.datatable table { border-collapse: collapse; width: 100%; font-size: 13px; }
.datatable th {
  text-align: left;
  padding: 10px 12px;
  background: var(--bg-sub);
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-dim);
  border-bottom: var(--rule-thin);
  position: sticky; top: 0;
}
.datatable td {
  padding: 9px 12px;
  border-bottom: var(--rule-thin);
  font-family: var(--font-mono);
  font-size: 12.5px;
}
.datatable tr:last-child td { border-bottom: none; }
.datatable tr:hover td { background: var(--bg-sub); }
.td-num { text-align: right; font-variant-numeric: tabular-nums; }

/* ========= CHART HELPERS ========= */
.chart { width: 100%; display: block; }
.chart-axis text { font-family: var(--font-mono); font-size: 10px; fill: var(--ink-dim); }
.chart-grid line { stroke: var(--border); stroke-dasharray: 2 3; }

/* ========= RESULT ROW ========= */
.result-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 24px;
  align-items: start;
  padding: 20px 0;
  border-top: var(--rule);
}
.result-num { font-family: var(--font-display); font-size: 64px; line-height: 0.9; color: var(--accent); letter-spacing: -0.03em; min-width: 80px; }
.result-name { font-family: var(--font-display); font-size: 24px; letter-spacing: -0.01em; margin: 0 0 4px; }
.result-stat-row { display: flex; gap: 24px; margin-top: 12px; flex-wrap: wrap; }
.result-stat { display: flex; flex-direction: column; gap: 2px; }
.result-stat-k { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); }
.result-stat-v { font-family: var(--font-mono); font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
.verdict {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.12em; text-transform: uppercase;
  padding: 8px 14px;
  border: var(--rule-thin);
  white-space: nowrap;
  align-self: start;
}
.verdict.yes { color: var(--ok); border-color: var(--ok); background: color-mix(in oklab, var(--ok) 10%, transparent); }
.verdict.no { color: var(--muted); border-color: var(--border-strong); }

/* ========= CHIPS/TAGS ========= */
.chip {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 4px 10px;
  border: var(--rule-thin);
  background: var(--bg-sub);
  color: var(--ink-dim);
  display: inline-block;
}

/* ========= RISK PREDICTOR ========= */
.predictor { display: grid; grid-template-columns: 1.1fr 1fr; gap: 0; border: var(--rule); box-shadow: var(--shadow-hard); background: var(--bg-elev); }
.predictor-col { padding: 32px; }
.predictor-col.form { border-right: var(--rule-thin); }
.predictor-col.result { background: var(--bg-sub); position: sticky; top: 120px; align-self: start; }

.freq-q {
  padding: 16px 0;
  border-top: var(--rule-thin);
}
.freq-q:first-child { border-top: none; }
.freq-label { font-size: 14px; margin-bottom: 10px; display: flex; align-items: baseline; gap: 10px; }
.freq-label-ic { font-family: var(--font-display); font-size: 22px; color: var(--accent); line-height: 1; min-width: 24px; }
.freq-opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.freq-opt {
  background: var(--bg-elev);
  border: var(--rule-thin);
  padding: 8px 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.05em;
  color: var(--ink-dim);
  text-align: center;
  transition: all 0.12s;
}
.freq-opt:hover { border-color: var(--border-strong); color: var(--ink); }
.freq-opt.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.pill-group { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  background: var(--bg-elev);
  border: var(--rule-thin);
  padding: 6px 14px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-dim);
  border-radius: 99px;
}
.pill:hover { color: var(--ink); border-color: var(--border-strong); }
.pill.active { background: var(--accent); color: white; border-color: var(--accent); }

.slider-wrap { padding: 8px 0; }
.slider-val { font-family: var(--font-mono); font-size: 24px; color: var(--accent); margin-bottom: 6px; }
.slider-wrap input[type=range] { width: 100%; accent-color: var(--accent); }
.slider-ticks { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-top: 4px; }

/* Result side */
.risk-display {
  text-align: center;
  padding: 16px 0;
  margin-bottom: 20px;
}
.risk-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 8px; }
.risk-score { font-family: var(--font-display); font-size: 92px; line-height: 0.9; letter-spacing: -0.04em; margin-bottom: 4px; }
.risk-outof { font-family: var(--font-mono); font-size: 13px; color: var(--ink-dim); }

.risk-meter {
  height: 10px; background: var(--bg-elev);
  border: var(--rule-thin);
  margin: 20px 0;
  position: relative;
  overflow: hidden;
}
.risk-meter-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--ok) 0%, var(--warn) 50%, var(--danger) 100%);
  transition: width 0.4s cubic-bezier(.2,.9,.3,1);
}
.risk-meter-marker {
  position: absolute; top: -4px; bottom: -4px;
  width: 2px; background: var(--ink);
}

.verdict-card {
  padding: 16px;
  border: var(--rule-thin);
  background: var(--bg-elev);
  margin-bottom: 16px;
}
.verdict-card.high { border-color: var(--danger); background: color-mix(in oklab, var(--danger) 10%, var(--bg-elev)); }
.verdict-card.med { border-color: var(--warn); background: color-mix(in oklab, var(--warn) 15%, var(--bg-elev)); }
.verdict-card.low { border-color: var(--ok); background: color-mix(in oklab, var(--ok) 10%, var(--bg-elev)); }
.verdict-title { font-family: var(--font-display); font-size: 22px; letter-spacing: -0.01em; margin: 0 0 4px; }
.verdict-desc { font-size: 13px; line-height: 1.5; margin: 0; }

.risk-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.risk-stat {
  padding: 14px;
  border: var(--rule-thin);
  background: var(--bg-elev);
}
.risk-stat-k { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 4px; }
.risk-stat-v { font-family: var(--font-display); font-size: 24px; letter-spacing: -0.01em; }

.tips { margin-top: 20px; }
.tips-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 10px; }
.tip {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 0;
  border-top: var(--rule-thin);
  font-size: 13px;
  line-height: 1.5;
}
.tip-mark { color: var(--accent); font-family: var(--font-display); font-size: 16px; line-height: 1.2; }

/* ========= CLUSTER CARDS ========= */
.cluster-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.cluster-card {
  padding: 20px;
  border: var(--rule-thin);
  background: var(--bg-elev);
}
.cluster-card.easy { border-top: 4px solid var(--danger); }
.cluster-card.aware { border-top: 4px solid var(--warn); }
.cluster-card.immune { border-top: 4px solid var(--ok); }
.cluster-name { font-family: var(--font-display); font-size: 22px; letter-spacing: -0.01em; margin: 0 0 4px; }
.cluster-tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 16px; }
.cluster-stats { display: flex; flex-direction: column; gap: 8px; }
.cluster-stat { display: flex; justify-content: space-between; font-size: 13px; border-bottom: var(--rule-thin); padding-bottom: 6px; }
.cluster-stat-k { color: var(--ink-dim); font-family: var(--font-mono); font-size: 11px; }
.cluster-stat-v { font-family: var(--font-mono); font-weight: 500; }

/* ========= TWEAKS PANEL ========= */
.tweaks-panel {
  position: fixed; bottom: 20px; right: 20px;
  width: 320px;
  background: var(--bg-elev);
  border: var(--rule);
  box-shadow: var(--shadow-hard);
  z-index: 300;
}
.tweaks-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: var(--rule-thin); }
.tweaks-title { font-family: var(--font-display); font-size: 18px; letter-spacing: -0.01em; }
.tweaks-close { background: none; border: var(--rule-thin); width: 26px; height: 26px; color: var(--ink); }
.tweaks-body { padding: 16px; display: flex; flex-direction: column; gap: 18px; }
.tweak-group { display: flex; flex-direction: column; gap: 8px; }
.tweak-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
.tweak-opts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.tweak-opt {
  padding: 10px 8px;
  background: var(--bg-sub);
  border: var(--rule-thin);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-dim);
  text-align: center;
}
.tweak-opt.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ========= UTILS ========= */
.hr-heavy { height: 0; border: 0; border-top: var(--rule); margin: 40px 0 24px; }
.hr-thin { height: 0; border: 0; border-top: var(--rule-thin); margin: 24px 0; }

.info-callout {
  border-left: 4px solid var(--accent);
  padding: 12px 16px;
  background: var(--accent-soft);
  color: var(--ink);
  margin: 16px 0;
  font-size: 14px;
  line-height: 1.5;
}
.info-callout.warn { border-color: var(--warn); background: color-mix(in oklab, var(--warn) 15%, var(--bg-elev)); }
.info-callout.danger { border-color: var(--danger); background: color-mix(in oklab, var(--danger) 10%, var(--bg-elev)); }

/* ========= RESPONSIVE ========= */
@media (max-width: 900px) {
  .bignums { grid-template-columns: repeat(2, 1fr); }
  .bignum:nth-child(2) { border-right: none; }
  .bignum:nth-child(1), .bignum:nth-child(2) { border-bottom: var(--rule-thin); }
  .cols-2, .cols-3 { grid-template-columns: 1fr; }
  .cluster-grid { grid-template-columns: 1fr; }
  .predictor { grid-template-columns: 1fr; }
  .predictor-col.form { border-right: none; border-bottom: var(--rule-thin); }
  .predictor-col.result { position: static; }
  .page { padding: 24px 16px 60px; }
  .masthead { padding: 14px 16px; }
  .tabs-bar { padding: 0 16px; }
  .freq-opts { grid-template-columns: repeat(2, 1fr); }
}

</style>
</head>

function hist(values, bins) {
  const min = Math.min(...values), max = Math.max(...values);
  const w = (max - min) / bins;
  const counts = Array(bins).fill(0);
  for (const v of values) {
    const i = Math.min(bins - 1, Math.floor((v - min) / w));
    counts[i]++;

const DescRow = ({ k, prefix = "", dp = 2 }) => {
  const vals = DATASET.map(d => d[k]);
  const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
  const sd = Math.sqrt(vals.reduce((a, b) => a + (b - mean) ** 2, 0) / vals.length);
  return (
    <tr>
      <td>{k}</td>
      <td className="td-num">{prefix}{mean.toFixed(dp)}</td>
      <td className="td-num">{sd.toFixed(2)}</td>
      <td className="td-num">{prefix}{Math.min(...vals).toFixed(dp)}</td>
      <td className="td-num">{prefix}{Math.max(...vals).toFixed(dp)}</td>
    </tr>
  );
};

const Histogram = ({ data, color, xlabel }) => {
  const w = 560, h = 200, padL = 32, padB = 28, padT = 12, padR = 8;
  const maxC = Math.max(...data.map(d => d.c));
  const barW = (w - padL - padR) / data.length;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="chart" preserveAspectRatio="xMidYMid meet">
      {/* gridlines */}
      <g className="chart-grid">
        {[0.25, 0.5, 0.75, 1].map(t => (
          <line key={t} x1={padL} x2={w-padR} y1={padT + (1-t)*(h-padT-padB)} y2={padT + (1-t)*(h-padT-padB)}/>
        ))}
      </g>
      {/* bars */}
      {data.map((d, i) => {
        const hb = (d.c / maxC) * (h - padT - padB);
        return (
          <g key={i}>
            <rect
              x={padL + i * barW + 1}
              y={h - padB - hb}
              width={barW - 2}
              height={hb}
              fill={color}
              opacity="0.85"
            />
          </g>
        );
      })}
      {/* axes */}
      <g className="chart-axis">
        <text x={padL} y={h - 8}>{Math.round(data[0].x0)}</text>
        <text x={w - padR} y={h - 8} textAnchor="end">{Math.round(data[data.length-1].x1)}</text>
        <text x={(padL + w - padR)/2} y={h - 2} textAnchor="middle" style={{fontSize: 9, fill: "var(--muted)"}}>{xlabel}</text>
        <text x={padL - 6} y={padT + 4} textAnchor="end">{maxC}</text>
        <text x={padL - 6} y={h - padB} textAnchor="end">0</text>
      </g>
    </svg>
  );
};

const AppBreakdown = () => {
  const total = Object.values(APP_COUNTS).reduce((a, b) => a + b, 0);
  const colors = { "Zomato": "var(--danger)", "Swiggy": "var(--warn)", "Both Equally": "var(--accent)" };
  return (
    <div className="card boxed">
      {Object.entries(APP_COUNTS).map(([k, v]) => {
        const pct = (v / total) * 100;
        return (
          <div key={k} style={{marginBottom: 18}}>
            <div style={{display: "flex", justifyContent: "space-between", marginBottom: 6, fontSize: 13}}>
              <span style={{fontWeight: 500}}>{k}</span>
              <span className="mono">{v} · {pct.toFixed(1)}%</span>
            </div>
            <div style={{height: 24, background: "var(--bg-sub)", border: "var(--rule-thin)", position: "relative"}}>
              <div style={{
                position: "absolute", top: 0, left: 0, bottom: 0,
                width: `${pct}%`, background: colors[k],
              }}/>
            </div>
          </div>
        );
      })}
    </div>
  );
};

<script type="text/babel">

const ScatterPlot = () => {
  const w = 800, h = 280, padL = 40, padB = 32, padT = 12, padR = 12;
  const xMax = 37, yMax = 1.2, yMin = -0.2;
  const x = (v) => padL + (v / xMax) * (w - padL - padR);
  const y = (v) => padT + (1 - (v - yMin) / (yMax - yMin)) * (h - padT - padB);
  // regression line slope ~0.03, intercept ~0.05
  const xs = SCATTER.map(p => p.x), ys = SCATTER.map(p => p.y);
  const xm = xs.reduce((a, b) => a + b, 0) / xs.length;
  const ym = ys.reduce((a, b) => a + b, 0) / ys.length;
  const num = xs.reduce((a, _, i) => a + (xs[i] - xm) * (ys[i] - ym), 0);
  const den = xs.reduce((a, v) => a + (v - xm) ** 2, 0);
  const slope = num / den;
  const intercept = ym - slope * xm;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="chart" preserveAspectRatio="xMidYMid meet">
      <g className="chart-grid">
        {[0, 0.25, 0.5, 0.75, 1].map(t => (
          <line key={t} x1={padL} x2={w - padR} y1={y(t)} y2={y(t)}/>
        ))}
      </g>
      {SCATTER.map((p, i) => (
        <circle key={i} cx={x(p.x)} cy={y(p.y)} r="3" fill="var(--accent)" opacity="0.45"/>
      ))}
      <line x1={x(0)} y1={y(intercept)} x2={x(xMax)} y2={y(intercept + slope * xMax)}
        stroke="var(--danger)" strokeWidth="2"/>
      <g className="chart-axis">
        <text x={padL} y={h - 12}>0</text>
        <text x={x(10)} y={h - 12}>10</text>
        <text x={x(20)} y={h - 12}>20</text>
        <text x={x(30)} y={h - 12}>30</text>
        <text x={(padL + w)/2} y={h - 2} textAnchor="middle" style={{fontSize: 9, fill: "var(--muted)"}}>manipulation score →</text>
        <text x={padL - 6} y={y(1)} textAnchor="end">1 yes</text>
        <text x={padL - 6} y={y(0)} textAnchor="end">0 no</text>
      </g>
    </svg>
  );
};

const AnovaBar = () => {
  const w = 800, h = 240, padL = 40, padB = 50, padT = 20, padR = 12;
  const maxVal = Math.max(...ANOVA_GROUPS.map(g => g.mean));
  const barW = (w - padL - padR) / ANOVA_GROUPS.length;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="chart" preserveAspectRatio="xMidYMid meet">
      <g className="chart-grid">
        {[0.25, 0.5, 0.75, 1].map(t => (
          <line key={t} x1={padL} x2={w-padR} y1={padT + (1-t)*(h-padT-padB)} y2={padT + (1-t)*(h-padT-padB)}/>
        ))}
      </g>
      {ANOVA_GROUPS.map((g, i) => {
        const hb = (g.mean / maxVal) * (h - padT - padB) * 0.9;
        const bx = padL + i * barW + barW * 0.2;
        const bw = barW * 0.6;
        return (
          <g key={i}>
            <rect x={bx} y={h - padB - hb} width={bw} height={hb} fill={g.color} opacity="0.9"/>
            <text x={bx + bw/2} y={h - padB - hb - 8} textAnchor="middle"
              style={{fontFamily: "var(--font-mono)", fontSize: 14, fill: "var(--ink)", fontWeight: 600}}>
              ₹{g.mean.toFixed(2)}
            </text>
            <text x={bx + bw/2} y={h - padB + 16} textAnchor="middle"
              style={{fontFamily: "var(--font-mono)", fontSize: 11, fill: "var(--ink-dim)"}}>
              {g.name}
            </text>
            <text x={bx + bw/2} y={h - padB + 30} textAnchor="middle"
              style={{fontFamily: "var(--font-mono)", fontSize: 10, fill: "var(--muted)"}}>
              n={g.n}
            </text>
          </g>
        );
      })}
    </svg>
  );
};

const ClusterPlot = () => {
  const w = 800, h = 320, padL = 40, padB = 40, padT = 12, padR = 12;
  // Fabricate cluster points roughly at centroids
  const points = [];
  CLUSTERS.forEach((c, ci) => {
    for (let i = 0; i < c.n; i++) {
      points.push({
        x: Math.max(0, Math.min(40, c.ms + (Math.random() - 0.5) * 8)),
        y: Math.max(1, Math.min(5, c.pi + (Math.random() - 0.5) * 1.4)),
        c: ci,
      });
    }
  });
  const colors = ["var(--danger)", "var(--warn)", "var(--ok)"];
  const x = (v) => padL + (v / 40) * (w - padL - padR);
  const y = (v) => padT + (1 - (v - 1) / 4) * (h - padT - padB);
  return (
    <>
      <svg viewBox={`0 0 ${w} ${h}`} className="chart" preserveAspectRatio="xMidYMid meet">
        <g className="chart-grid">
          {[1, 2, 3, 4, 5].map(t => (
            <line key={t} x1={padL} x2={w-padR} y1={y(t)} y2={y(t)}/>
          ))}
        </g>
        {points.map((p, i) => (
          <circle key={i} cx={x(p.x)} cy={y(p.y)} r="3.5" fill={colors[p.c]} opacity="0.5"/>
        ))}
        {CLUSTERS.map((c, i) => (
          <g key={c.key}>
            <circle cx={x(c.ms)} cy={y(c.pi)} r="9" fill={colors[i]} stroke="var(--bg)" strokeWidth="3"/>
            <text x={x(c.ms) + 14} y={y(c.pi) + 4}
              style={{fontFamily: "var(--font-display)", fontSize: 16, fill: "var(--ink)"}}>{c.name}</text>
          </g>
        ))}
        <g className="chart-axis">
          <text x={padL} y={h - 22}>0</text>
          <text x={x(20)} y={h - 22}>20</text>
          <text x={x(40)} y={h - 22}>40</text>
          <text x={(padL + w)/2} y={h - 6} textAnchor="middle" style={{fontSize: 10, fill: "var(--muted)"}}>manipulation score →</text>
          <text x={padL - 6} y={y(1)} textAnchor="end">1</text>
          <text x={padL - 6} y={y(3)} textAnchor="end">3</text>
          <text x={padL - 6} y={y(5)} textAnchor="end">5</text>
        </g>
      </svg>
    </>
  );
};

// ============ PREDICTOR ============
const FREQ_OPTS = ["Never", "Rarely", "Often", "Always"];
const FREQ_MAP = { Never: 0, Rarely: 1, Often: 2, Always: 3 };

const Predictor = () => {
  const [p1, setP1] = useState2("Rarely");
  const [p2, setP2] = useState2("Rarely");
  const [p3, setP3] = useState2("Never");
  const [p4, setP4] = useState2("Never");
  const [p5, setP5] = useState2("Never");
  const [p6, setP6] = useState2("Rarely");
  const [orders, setOrders] = useState2("3-5 times");
  const [income, setIncome] = useState2("₹10000-₹20000");
  const [awareness, setAwareness] = useState2(3);

  const score = FREQ_MAP[p1]*3 + FREQ_MAP[p2]*3 + FREQ_MAP[p3]*3
              + FREQ_MAP[p4]*2 + FREQ_MAP[p5]*2 + FREQ_MAP[p6]*1;

  const ordersNum = { "1-2 times": 1.5, "3-5 times": 4, "6 or more times": 6 }[orders];

  // Real sklearn LogisticRegression coefficients
  // Features: manipulation_score, orders_per_week_num, income_level, protection_intent
  const LR_COEF = [0.1372813259144757, 0.29658715902948546, -0.01227058369927524, -0.04493211784001939];
  const LR_INTERCEPT = -3.0804342363918167;
  const incomeMap = {"Below \u20b95000": 1, "\u20b95000-\u20b910000": 2, "\u20b910000-\u20b920000": 3, "\u20b920000+": 4};
  const incomeNum = incomeMap[income] || 2;
  const z = LR_COEF[0]*score + LR_COEF[1]*ordersNum + LR_COEF[2]*incomeNum + LR_COEF[3]*awareness + LR_INTERCEPT;
  const prob = 1 / (1 + Math.exp(-z));

  let level, cls, title, desc;
  if (prob >= 0.65) {
    level = "HIGH"; cls = "high"; title = "🎯 Easy Target";
    desc = "You're highly exposed to dark patterns and very likely to make unplanned purchases. Every order is a minor fight.";
  } else if (prob >= 0.4) {
    level = "MEDIUM"; cls = "med"; title = "🤔 Aware but Affected";
    desc = "You notice manipulation, but hidden charges and urgency still slip past your defenses.";
  } else {
    level = "LOW"; cls = "low"; title = "🛡 Immune User";
    desc = "You're relatively resistant. Your budget survives contact with the checkout screen.";
  }

  const estExtra = Math.round(score * 4.5);
  const annual = Math.round(estExtra * ordersNum * 52);

  const tips = [];
  if (FREQ_MAP[p2] >= 2) tips.push("Always check your final cart total before confirming payment.");
  if (FREQ_MAP[p1] >= 2) tips.push("Ignore countdown timers — they almost always reset on reload.");
  if (FREQ_MAP[p3] >= 1) tips.push("Scroll through your cart carefully; remove anything you didn't choose.");
  if (FREQ_MAP[p6] >= 2) tips.push("'Free delivery' usually requires a subscription or minimum order.");
  tips.push("Set a budget in your head before opening the app.");
  tips.push("Browse on airplane mode first — no pressure, no timers.");

  return (
    <div className="page">
      <div className="eyebrow">Section 04 · Interactive</div>
      <h1 className="headline">How <em>manipulated</em> are you?</h1>
      <p className="kicker">
        Answer nine quick questions. We compute your score using the same formula as the paper,
        then predict your probability of unplanned purchase with the trained logistic regression.
      </p>

      <div className="predictor" style={{marginTop: 32}}>
        <div className="predictor-col form">
          <div className="eyebrow" style={{marginBottom: 16}}>Part A · How often do you see…</div>

          <FreqQ icon="⏱" label="Countdown timers, e.g. “Offer ends 4:32”" value={p1} onChange={setP1}/>
          <FreqQ icon="₹" label="Hidden charges revealed only at checkout" value={p2} onChange={setP2}/>
          <FreqQ icon="⊕" label="Items pre-added to your cart" value={p3} onChange={setP3}/>
          <FreqQ icon="⎋" label="Difficulty cancelling Zomato Gold / Swiggy One" value={p4} onChange={setP4}/>
          <FreqQ icon="✕" label="Guilt-tripping decline buttons" value={p5} onChange={setP5}/>
          <FreqQ icon="→" label="Misleading ‘Free Delivery’ claims" value={p6} onChange={setP6}/>

          <div className="eyebrow" style={{marginTop: 24, marginBottom: 12}}>Part B · About you</div>

          <div className="freq-q" style={{border: 0, padding: "8px 0"}}>
            <div className="freq-label">Orders per week</div>
            <div className="pill-group">
              {["1-2 times", "3-5 times", "6 or more times"].map(o => (
                <button key={o} className={`pill ${orders === o ? "active" : ""}`} onClick={() => setOrders(o)}>{o}</button>
              ))}
            </div>
          </div>

          <div className="freq-q" style={{padding: "8px 0"}}>
            <div className="freq-label">Monthly income / pocket money</div>
            <div className="pill-group">
              {INCOMES.map(o => (
                <button key={o} className={`pill ${income === o ? "active" : ""}`} onClick={() => setIncome(o)}>{o}</button>
              ))}
            </div>
          </div>

          <div className="freq-q" style={{padding: "8px 0"}}>
            <div className="freq-label">How careful are you about spending?</div>
            <div className="slider-wrap">
              <div className="slider-val">{awareness} <span style={{fontSize: 12, color: "var(--ink-dim)"}}>/ 5</span></div>
              <input type="range" min="1" max="5" step="1" value={awareness} onChange={e => setAwareness(+e.target.value)}/>
              <div className="slider-ticks"><span>not at all</span><span>very careful</span></div>
            </div>
          </div>
        </div>

        <div className="predictor-col result">
          <div className="risk-display">
            <div className="risk-label">Your manipulation score</div>
            <div className="risk-score" style={{color: prob >= 0.65 ? "var(--danger)" : prob >= 0.4 ? "var(--warn)" : "var(--ok)"}}>{score}</div>
            <div className="risk-outof">out of 42 possible</div>
          </div>

          <div className="risk-meter">
            <div className="risk-meter-fill" style={{ width: `${Math.min(100, (score / 42) * 100)}%` }}/>
            <div className="risk-meter-marker" style={{ left: "65%" }}/>
          </div>
          <div style={{display: "flex", justifyContent: "space-between", fontFamily: "var(--font-mono)", fontSize: 10, color: "var(--muted)", marginTop: -12, marginBottom: 16}}>
            <span>0 · safe</span><span>27 · danger line</span><span>42 · max</span>
          </div>

          <div className={`verdict-card ${cls}`}>
            <div className="eyebrow" style={{marginBottom: 4}}>Risk level · {level} · {Math.round(prob * 100)}% chance of unplanned purchase</div>
            <div className="verdict-title">{title}</div>
            <p className="verdict-desc">{desc}</p>
          </div>

          <div className="risk-stats">
            <div className="risk-stat">
              <div className="risk-stat-k">Extra per order</div>
              <div className="risk-stat-v">₹{estExtra}</div>
            </div>
            <div className="risk-stat">
              <div className="risk-stat-k">Est. annual overspend</div>
              <div className="risk-stat-v">₹{annual.toLocaleString("en-IN")}</div>
            </div>
          </div>

          <div className="tips">
            <div className="tips-title">What to do about it</div>
            {tips.map((t, i) => (
              <div key={i} className="tip">
                <span className="tip-mark">→</span>
                <span>{t}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
};

const FreqQ = ({ icon, label, value, onChange }) => (
  <div className="freq-q">
    <div className="freq-label">
      <span className="freq-label-ic">{icon}</span>
      <span>{label}</span>
    </div>
    <div className="freq-opts">
      {FREQ_OPTS.map(o => (
        <button key={o} className={`freq-opt ${value === o ? "active" : ""}`} onClick={() => onChange(o)}>{o}</button>
      ))}
    </div>
  </div>
);

Object.assign(window, { Analysis, Predictor });

</script>
<script type="text/babel">
const { useState: useState3, useEffect: useEffect3 } = React;

const TABS = [
  { id: "overview", label: "Overview" },
  { id: "dataset", label: "Dataset" },
  { id: "analysis", label: "Findings" },
  { id: "predictor", label: "Risk Predictor" },
];

const App = () => {
  const [tab, setTab] = useState3(() => localStorage.getItem("ssdi.tab") || "overview");
  const [tweaksOpen, setTweaksOpen] = useState3(false);

  const DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "expose",
    "density": "standard"
  }/*EDITMODE-END*/;
  const [tweaks, setTweaks] = useState3(() => {
    try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem("ssdi.tweaks") || "{}") }; }
    catch { return DEFAULTS; }
  });

  useEffect3(() => { localStorage.setItem("ssdi.tab", tab); }, [tab]);
  useEffect3(() => {
    localStorage.setItem("ssdi.tweaks", JSON.stringify(tweaks));
    document.documentElement.dataset.theme = tweaks.theme;
  }, [tweaks]);

  useEffect3(() => {
    const onMsg = (e) => {
      if (e.data?.type === "__activate_edit_mode") setTweaksOpen(true);
      if (e.data?.type === "__deactivate_edit_mode") setTweaksOpen(false);
    };
    window.addEventListener("message", onMsg);
    window.parent?.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  useEffect3(() => {
    window.parent?.postMessage({ type: "__edit_mode_set_keys", edits: tweaks }, "*");
  }, [tweaks]);

  return (
    <>
      <header className="masthead">
        <div className="masthead-left">
          <div>
            <div className="masthead-title">Dark Patterns<span style={{color: "var(--accent)"}}>.</span></div>
            <div className="masthead-sub">An SSDI investigation · Zomato × Swiggy</div>
          </div>
        </div>
        <div className="masthead-issue">Vol. 01 · N= 213</div>
      </header>

      <nav className="tabs-bar">
        {TABS.map((t, i) => (
          <button key={t.id} className={`tab-btn ${tab === t.id ? "active" : ""}`}
            data-screen-label={`${String(i+1).padStart(2, "0")} ${t.label}`}
            onClick={() => setTab(t.id)}>
            <span className="tab-num">0{i+1}</span>{t.label}
          </button>
        ))}
      </nav>

      <main data-screen-label={TABS.find(t => t.id === tab)?.label}>
        {tab === "overview" && <Overview/>}
        {tab === "dataset" && <Dataset/>}
        {tab === "analysis" && <Analysis/>}
        {tab === "predictor" && <Predictor/>}
      </main>

      {tweaksOpen && (
        <div className="tweaks-panel">
          <div className="tweaks-head">
            <div className="tweaks-title">Tweaks</div>
            <button className="tweaks-close" onClick={() => setTweaksOpen(false)}>✕</button>
          </div>
          <div className="tweaks-body">
            <div className="tweak-group">
              <div className="tweak-label">Visual direction</div>
              <div className="tweak-opts">
                {[
                  { id: "expose", name: "Exposé", sub: "warm paper" },
                  { id: "terminal", name: "Terminal", sub: "dark amber" },
                  { id: "pop", name: "Pop", sub: "brutal crisp" },
                ].map(t => (
                  <button key={t.id}
                    className={`tweak-opt ${tweaks.theme === t.id ? "active" : ""}`}
                    onClick={() => setTweaks(s => ({ ...s, theme: t.id }))}>
                    <div style={{fontFamily: "var(--font-display)", fontSize: 14, marginBottom: 2}}>{t.name}</div>
                    <div style={{fontSize: 9, opacity: 0.7}}>{t.sub}</div>
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
